<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Lokithashivani through the accessible portfolio contact form.">

    <meta name="author"
          content="Lokithashivani">

    <title>Contact | Shivani Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">

            <h1>Contact Me</h1>

            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <div class="container">

                <h2 id="contact-heading">Get In Touch</h2>

                <form action="#" method="post">

                    <fieldset>

                        <legend>Contact Information</legend>

                        <div class="form-group">
                            <label for="name">Full Name</label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                autocomplete="name"
                                required
                                aria-required="true">
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required
                                aria-required="true">
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject</label>

                            <input
                                type="text"
                                id="subject"
                                name="subject"
                                required
                                aria-required="true">
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>

                            <textarea
                                id="message"
                                name="message"
                                rows="6"
                                required
                                aria-required="true"></textarea>
                        </div>

                        <button type="submit">
                            Send Message
                        </button>

                    </fieldset>

                </form>

            </div>

        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Shivani. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
